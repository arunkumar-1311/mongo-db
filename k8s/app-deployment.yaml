apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db-app
  namespace: mongo-db-app
  labels:
    app: mongo-db-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mongo-db-app
  template:
    metadata:
      labels:
        app: mongo-db-app
    spec:
      containers:
        - name: mongo-db-app
          image: mongo-db-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: mongo-db-app-config
                  key: MONGO_DB
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@mongo:27017"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-db-app
  namespace: mongo-db-app
spec:
  type: ClusterIP
  selector:
    app: mongo-db-app
  ports:
    - port: 80
      targetPort: 8000
